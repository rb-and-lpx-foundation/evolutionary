[tool.poetry]
name = "evolutionary"
version = "0.1.0"
description = "Demonstration of NSGA-II"
authors = ["Reuben Brasher <rkbrasher@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "evolutionary"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.2.6"
scikit-learn = "^1.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
black = "^26.3.1"
flake8 = "^7.3.0"
coverage = "^7.12.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
